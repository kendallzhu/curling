[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "curling"
version = "0.1.0"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-m 'not slow'"
markers = [
    "slow: tests excluded from the default test run",
]
